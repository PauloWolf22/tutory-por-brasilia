        <dt>→ · Espaço</dt><dd>Avançar</dd><dt>←</dt><dd>Voltar</dd>
        <dt>Home · End</dt><dd>Primeiro · último slide</dd><dt>F</dt><dd>Tela cheia</dd>
        <dt>M</dt><dd>Capítulos</dd><dt>I</dt><dd>Todas as propostas</dd>
        <dt>Esc</dt><dd>Fechar painel · sair da tela cheia</dd>
      </dl>
    </div>
  </div>

  <div id="inv" class="overlay" aria-hidden="true" role="dialog" aria-label="Todas as propostas">
    <div class="ov-panel inv-panel">
      <header><h3>Todas as <b>propostas</b></h3><span id="invCount"></span>
        <button class="ov-x" data-act="close" aria-label="Fechar"><svg class="ic"><use href="#i-x"/></svg></button></header>
      <div class="inv-filters">
        <div><label>Empresa</label><div class="chips" id="fOp"></div></div>
        <div><label>Formato</label><div class="chips" id="fFmt"></div></div>
        <div><label>Ordenar por</label><div class="chips" id="fSort"></div></div>

      <div id="invRows"></div>
    </div>
  </div>
